name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a new push cancels the older run of the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-smoke-test:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        run: docker compose up -d --build

      # No model exists in CI (it is not in Git), so the backend reports
      # model_loaded=false. This test proves: both images build, the containers
      # start, and nginx correctly proxies /api to FastAPI.
      - name: Wait for the app through nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/health -o health.json; then
              echo "Backend answered through nginx:"; cat health.json; echo
              break
            fi
            echo "waiting ($i/30)..."; sleep 2
          done
          grep -q '"status":"ok"' health.json
          curl -fsS http://localhost/ | grep -qi '<div id="root">'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
